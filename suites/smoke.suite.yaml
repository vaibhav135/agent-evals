# Two cheap tasks to check the pipeline end to end (no skill needed).
slug: smoke
name: Smoke tests
description: Minimal tasks that exercise files, fixtures and deterministic graders.
version: 1
tasks:
  - slug: hello-file
    name: Write a file
    category: control
    prompt: |
      Create a file named hello.txt in the current working directory containing exactly: hi
      Then reply with the single word: done
    timeoutS: 120
    maxIterations: 10
    graders:
      - { type: file_exists, path: hello.txt }
      - { type: contains, target: "file:hello.txt", value: hi }
      - { type: contains, value: done, description: "final answer says done" }

  - slug: orders-total
    name: Sum a CSV column
    category: control
    prompt: |
      orders.csv in the current working directory lists orders.
      Compute the total of the amount column and write it to total.json as {"total": <number>}.
    fixtures:
      orders.csv: { file: fixtures/smoke/orders.csv }
    timeoutS: 180
    maxIterations: 15
    graders:
      - { type: json_field, target: "file:total.json", path: total, equals: 1255 }
